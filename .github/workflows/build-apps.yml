name: Gerar instaladores (Android / iOS)

# Gera os instaladores via EAS Build (nuvem da Expo — não precisa de Mac):
#   preview    → APK Android (instala direto) + IPA iOS ad-hoc (iPhones registrados) — padrão
#   production → AAB / IPA para lojas (para quando for publicar)
#
# Pré-requisito único: rodar "npm run setup:ios" (e/ou setup:android) na pasta mobile
# e criar o secret EXPO_TOKEN no GitHub. Ver README.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: Perfil de build (eas.json)
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags:
      - 'v*' # git tag v1.0.0 && git push --tags → instaladores preview de Android + iOS

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # para anexar os links na GitHub Release

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  build:
    name: Instalador ${{ matrix.platform }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name == 'push' || inputs.platform == 'all') && '["android","ios"]' || format('["{0}"]', inputs.platform)) }}
    env:
      PROFILE: ${{ github.event_name == 'push' && 'preview' || inputs.profile }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Verificar EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Crie o secret EXPO_TOKEN (expo.dev → Account settings → Access tokens) em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Vincular projeto EAS (se ainda não houver projectId no app.json)
        run: |
          if ! node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::warning::app.json sem projectId — vinculando automaticamente. Rode 'npm run setup:ios' localmente e faça commit do app.json."
            eas init --non-interactive --force
          fi

      - name: Build
        id: build
        run: |
          set -o pipefail
          if ! eas build --platform ${{ matrix.platform }} --profile "$PROFILE" --non-interactive --json > build.json 2> build.log; then
            cat build.log
            if grep -qiE "credentials|provisioning|distribution certificate|apple" build.log; then
              echo "::error::Credenciais ${{ matrix.platform }} não configuradas. Rode uma vez localmente: cd mobile && npm run setup:${{ matrix.platform }}"
            fi
            exit 1
          fi
          cat build.log
          URL=$(node -e "const b=require('./build.json');console.log(b[0]?.artifacts?.buildUrl||'')")
          PAGE=$(node -e "const x=require('./build.json')[0];console.log(x?'https://expo.dev/accounts/'+x.project.ownerAccount.name+'/projects/'+x.project.slug+'/builds/'+x.id:'')")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"

      - name: Resumo
        run: |
          {
            echo "### 📦 ${{ matrix.platform }} · $PROFILE"
            echo ""
            echo "- **Instalar no celular:** abra a página do build no aparelho (ou leia o QR code): ${{ steps.build.outputs.page }}"
            echo "- Arquivo: ${{ steps.build.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anexar à GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            **${{ matrix.platform }}**: [instalar](${{ steps.build.outputs.page }}) · [arquivo](${{ steps.build.outputs.url }})
