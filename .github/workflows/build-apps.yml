name: Gerar instaladores (Android / iOS)

# ANDROID → compilado aqui mesmo no GitHub (Gradle). Não precisa de conta Expo nem token.
#   development → APK "development build": conecta ao `npx expo start` do seu computador (hot reload)
#   preview     → APK completo, roda sozinho (JS embutido) — precisa do secret SUPABASE_ANON_KEY
#   O APK sai em "Artifacts" no fim da execução (e na Release, quando disparado por tag).
#
# iOS → via EAS Build (nuvem da Expo). A Apple exige conta Apple Developer paga para instalar
#   em iPhone. Só roda se o secret EXPO_TOKEN existir; caso contrário é pulado (não falha).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Tipo de instalador
        type: choice
        options: [development, preview]
        default: development
  push:
    tags:
      - 'v*' # git tag v1.0.0 && git push --tags → APK preview + iOS (se configurado) na Release

concurrency:
  group: build-${{ github.ref }}-${{ inputs.profile || 'tag' }}
  cancel-in-progress: true

permissions:
  contents: write # anexar instaladores na GitHub Release

env:
  PROFILE: ${{ inputs.profile || 'preview' }}
  PLATFORM: ${{ inputs.platform || 'all' }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://eoowbybfrbmjxcjfniuu.supabase.co' }}

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  # ------------------------------------------------------------------ ANDROID
  android:
    name: Android APK (${{ inputs.profile || 'preview' }})
    needs: checks
    if: (inputs.platform || 'all') != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Variáveis do app (.env)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "$PROFILE" = "preview" ] && [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Para o APK preview, crie o secret SUPABASE_ANON_KEY (Supabase → Settings → API → anon public) em Settings → Secrets and variables → Actions."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          } > .env

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Ajustar memória do Gradle
        run: |
          sed -i '/^org.gradle.jvmargs/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> android/gradle.properties

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          TASK=$([ "$PROFILE" = "development" ] && echo assembleDebug || echo assembleRelease)
          ./gradlew "$TASK" --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renomear APK
        id: apk
        run: |
          VARIANT=$([ "$PROFILE" = "development" ] && echo debug || echo release)
          SRC=$(ls android/app/build/outputs/apk/$VARIANT/*.apk | head -n1)
          NAME="runup-$PROFILE-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          mkdir -p ../dist && cp "$SRC" "../dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Anexar à Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.apk.outputs.name }}

      - name: Resumo
        run: |
          {
            echo "### 🤖 Android · $PROFILE"
            echo ""
            echo "1. Baixe **${{ steps.apk.outputs.name }}** em *Artifacts* (no fim desta página) — vem dentro de um .zip."
            echo "2. Envie o .apk para o celular e abra (permita *instalar apps desconhecidos*)."
            if [ "$PROFILE" = "development" ]; then
              echo "3. No computador: \`cd mobile && npx expo start\` (mesma rede Wi-Fi; ou \`npx expo start --tunnel\`)."
              echo "4. Abra o app RunUp no celular e leia o QR code / escolha o servidor."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------- iOS
  ios:
    name: iOS (${{ inputs.profile || 'preview' }})
    needs: checks
    if: (inputs.platform || 'all') != 'android'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Verificar configuração
        id: cfg
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::iOS pulado: crie o secret EXPO_TOKEN (expo.dev → Access tokens) e tenha uma conta Apple Developer. Ver README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        if: steps.cfg.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: steps.cfg.outputs.ok == 'true'

      - name: Vincular projeto EAS e variáveis
        if: steps.cfg.outputs.ok == 'true'
        run: |
          node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)" || eas init --non-interactive --force
          # injeta as variáveis do Supabase no perfil do eas.json (usadas no JS embutido)
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('eas.json','utf8'));
            const p=j.build[process.env.PROFILE];
            p.env={...(p.env||{}),EXPO_PUBLIC_SUPABASE_URL:process.env.SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY:process.env.SUPABASE_ANON_KEY||''};
            fs.writeFileSync('eas.json',JSON.stringify(j,null,2));"

      - name: Build
        id: build
        if: steps.cfg.outputs.ok == 'true'
        env:
          EAS_NO_VCS: '1'
        run: |
          if ! eas build --platform ios --profile "$PROFILE" --non-interactive --json > build.json 2> build.log; then
            cat build.log
            if grep -qiE "credential|provisioning|certificate|apple|device" build.log; then
              echo "::error::Credenciais iOS ausentes. A Apple exige conta Apple Developer + registro do iPhone (uma vez): cd mobile && npx eas-cli@latest device:create && npx eas-cli@latest credentials -p ios"
            fi
            exit 1
          fi
          cat build.log
          PAGE=$(node -e "const x=require('./build.json')[0];console.log('https://expo.dev/accounts/'+x.project.ownerAccount.name+'/projects/'+x.project.slug+'/builds/'+x.id)")
          echo "page=$PAGE" >> "$GITHUB_OUTPUT"
          echo "### 🍎 iOS · $PROFILE — abra no iPhone para instalar: $PAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Anexar à Release
        if: steps.cfg.outputs.ok == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: '**iOS**: [instalar](${{ steps.build.outputs.page }})'
