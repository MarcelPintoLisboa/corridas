name: Gerar instaladores (APK e IPA)

# Compila tudo no próprio GitHub — sem EAS, sem conta Expo.
#   Android → runner Ubuntu (Gradle)   → APK
#   iOS     → runner macOS (xcodebuild) → IPA
#
# Tipos:
#   development → development build (expo-dev-client): conecta ao `npx expo start` do seu PC
#   preview     → app completo com o JS embutido (padrão; roda sozinho, sem PC)
#
# Funciona SEM configurar nada (mesmo modelo do assistencia-ml):
#   Android sem secrets → APK assinado com a chave de debug (instala em qualquer Android)
#   Android com secrets ANDROID_* → APK assinado com sua keystore (plugins/withReleaseSigning.js)
#   versionCode/buildNumber = número da execução: cada instalador novo instala por cima do anterior
#
# iOS sem certificados nos Secrets → IPA SEM assinatura: instale com Sideloadly/AltStore
#   usando um Apple ID gratuito. Com os secrets IOS_* → IPA assinado (ad-hoc/development).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: Tipo de instalador
        type: choice
        options: [preview, development]
        default: preview
      ios_runner:
        description: 'Máquina do iOS (se der "job was not acquired"/fila longa, tente a Intel)'
        type: choice
        options: [macos-latest, macos-15-intel, macos-15]
        default: macos-latest
      ios_export_method:
        description: 'IPA assinado (só se houver secrets IOS_*): método de exportação'
        type: choice
        options: [ad-hoc, development, app-store]
        default: ad-hoc
  push:
    tags: ['v*'] # git tag v1.0.0 && git push --tags → instaladores preview na Release

concurrency:
  group: build-${{ github.ref }}-${{ inputs.profile || 'tag' }}
  cancel-in-progress: true

env:
  PROFILE: ${{ inputs.profile || 'preview' }}
  # opcional: só para apontar para OUTRO projeto Supabase (o padrão está em src/lib/supabase.ts)
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  # ================================================================== ANDROID
  android:
    name: Android APK (${{ inputs.profile || 'preview' }})
    needs: checks
    if: (inputs.platform || 'all') != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Versão e .env
        id: versao
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          fi
          echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Preparar keystore própria (opcional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          # o gradle.properties gerado não termina com quebra de linha: sem o \n inicial
          # o texto colaria na última linha (expo.inlineModules.watchedDirectories=[])
          sed -i '/^org.gradle.jvmargs/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          tail -n 3 gradle.properties
          chmod +x gradlew
          TASK=$([ "$PROFILE" = "development" ] && echo assembleDebug || echo assembleRelease)
          ./gradlew "$TASK" --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Renomear APK
        run: |
          VARIANT=$([ "$PROFILE" = "development" ] && echo debug || echo release)
          mkdir -p ../dist
          cp android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk "../dist/runup-${{ steps.versao.outputs.v }}-$PROFILE.apk"
          {
            echo "### 🤖 Android · $PROFILE"
            echo "Baixe **android-apk** em *Artifacts*, passe o .apk para o celular e instale (permita *apps desconhecidos*)."
            [ "$PROFILE" = "development" ] && echo "Depois rode \`cd mobile && npx expo start\` no PC (mesmo Wi-Fi) e abra o app."
            echo ""
            echo "Travou em *Instalando…*? Extraia o .apk do .zip, desinstale versões com outra assinatura e, se o Play Protect bloquear, toque em *Mais detalhes → Instalar mesmo assim*."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::APK assinado com chave de DEBUG (instala normalmente, mas não serve para a Play Store). Configure os secrets ANDROID_* para usar sua keystore."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ====================================================================== iOS
  ios:
    name: iOS IPA (${{ inputs.profile || 'preview' }})
    needs: checks
    if: (inputs.platform || 'all') != 'android'
    runs-on: ${{ inputs.ios_runner || 'macos-latest' }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      P12_B64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      EXPORT_METHOD: ${{ inputs.ios_export_method || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Versão e .env
        id: versao
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          fi
          echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "config=$([ "$PROFILE" = "development" ] && echo Debug || echo Release)" >> "$GITHUB_OUTPUT"

      - name: Gerar projeto nativo (expo prebuild)
        run: |
          # buildNumber = número da execução (cada IPA novo instala por cima do anterior)
          node -e "const j=require('./app.json');j.expo.ios.buildNumber=String(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync('app.json',JSON.stringify(j,null,2))"
          npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Instalar Pods
        working-directory: mobile/ios
        run: pod install

      - name: Localizar workspace e scheme
        id: proj
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=${WS%.xcworkspace}" >> "$GITHUB_OUTPUT"

      # ---------- Caminho 1: IPA ASSINADO (quando os secrets iOS existem) ----------
      - name: Instalar certificado e perfil de provisionamento
        if: env.P12_B64 != '' && env.PROFILE_B64 != '' && env.TEAM_ID != ''
        id: assinatura
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Perfil: $UUID | Identidade: $IDENTITY"

      - name: Aplicar assinatura manual só no alvo do app
        if: steps.assinatura.outcome == 'success'
        working-directory: mobile/ios
        env:
          UUID: ${{ steps.assinatura.outputs.uuid }}
          IDENTITY: ${{ steps.assinatura.outputs.identity }}
          BUNDLE_ID: ${{ steps.assinatura.outputs.bundle }}
        run: |
          PBX=$(ls -d *.xcodeproj | head -1)/project.pbxproj
          sed -i '' -e '/CODE_SIGN_STYLE = /d' -e '/DEVELOPMENT_TEAM = /d' -e '/PROVISIONING_PROFILE_SPECIFIER = /d' -e '/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = /d' "$PBX"
          sed -i '' -E "s|PRODUCT_BUNDLE_IDENTIFIER = \"?$BUNDLE_ID\"?;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$IDENTITY\";|g" "$PBX"
          grep -c "PROVISIONING_PROFILE_SPECIFIER" "$PBX"

      - name: Arquivar e exportar IPA assinado
        if: steps.assinatura.outcome == 'success'
        working-directory: mobile/ios
        env:
          UUID: ${{ steps.assinatura.outputs.uuid }}
          BUNDLE_ID: ${{ steps.assinatura.outputs.bundle }}
        run: |
          set -o pipefail
          xcodebuild -workspace "${{ steps.proj.outputs.workspace }}" \
            -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration "${{ steps.versao.outputs.config }}" -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive | xcbeautify --renderer github-actions

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${UUID}</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mkdir -p ../../dist
          cp "$RUNNER_TEMP"/export/*.ipa "../../dist/runup-${{ steps.versao.outputs.v }}-$PROFILE-${EXPORT_METHOD}.ipa"

      # ---------- Caminho 2: IPA SEM ASSINATURA (sem secrets iOS) ----------
      - name: Compilar IPA sem assinatura
        if: steps.assinatura.outcome != 'success'
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace "${{ steps.proj.outputs.workspace }}" \
            -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration "${{ steps.versao.outputs.config }}" -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | xcbeautify --renderer github-actions
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/runup-${{ steps.versao.outputs.v }}-$PROFILE-unsigned.ipa" Payload)
          echo "::warning::IPA SEM assinatura. Instale no iPhone com Sideloadly (Windows/Mac) ou AltStore usando seu Apple ID — ou configure os secrets IOS_* para gerar IPA assinado."

      - name: Resumo
        run: |
          {
            echo "### 🍎 iOS · $PROFILE"
            echo "Baixe **ios-ipa** em *Artifacts*."
            if [ "${{ steps.assinatura.outcome }}" = "success" ]; then
              echo "IPA assinado ($EXPORT_METHOD): instale pelo Apple Configurator, Diawi ou link OTA."
            else
              echo "IPA sem assinatura: no PC, abra o **Sideloadly**, conecte o iPhone por cabo, arraste o .ipa e entre com seu Apple ID (grátis = vale 7 dias)."
              echo "No iPhone: *Ajustes → Geral → VPN e Gerenciamento de Dispositivos* → confie no seu Apple ID; ative o *Modo de Desenvolvedor*."
            fi
            [ "$PROFILE" = "development" ] && echo "Depois rode \`cd mobile && npx expo start\` no PC (mesmo Wi-Fi) e abra o app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar keychain
        if: always() && steps.assinatura.outcome == 'success'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  # ================================================================== RELEASE
  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
