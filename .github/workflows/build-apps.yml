name: Gerar instaladores (APK e IPA)

# Gera os instaladores COMPLETOS do Street Running (app inteiro embutido, funcionam sozinhos):
#   Android → APK (runner Ubuntu)
#   iOS     → IPA (runner macOS)
#
# Rode pela aba Actions → "Gerar instaladores (APK e IPA)" → Run workflow.
# Os arquivos ficam em Artifacts (android-apk e ios-ipa). Com tag v* vão também para uma Release.
#
# Assinatura (automática, só se os secrets existirem):
#   Android: secrets ANDROID_* → sua keystore; sem eles → chave de debug (instala normalmente)
#   iOS:     secrets IOS_*     → IPA assinado (ad-hoc); sem eles → IPA sem assinatura (Sideloadly/AltStore)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================== ANDROID
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Versão do app
        id: versao
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # Se os secrets estiverem incompletos/inválidos, avisa e segue com a chave de debug
      # (o APK continua instalando) em vez de derrubar o build.
      - name: Preparar keystore própria (se houver secrets)
        if: env.KEYSTORE_B64 != ''
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          # remove \r, \n e espaços (comuns ao copiar o base64 no Windows)
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 --decode > "$KS" 2>/dev/null; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 não é um base64 válido — usando a chave de DEBUG. Gere de novo com: [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"release.keystore\")) | Set-Clipboard"
            exit 0
          fi
          if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::warning::Faltam os secrets ANDROID_KEYSTORE_PASSWORD e/ou ANDROID_KEY_ALIAS — usando a chave de DEBUG."
            exit 0
          fi
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::warning::A keystore não abriu com a senha/alias informados (confira ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_ALIAS) — usando a chave de DEBUG."
            exit 0
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "Keystore própria OK (alias $KS_ALIAS)."

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          # o gradle.properties gerado não termina com quebra de linha (o \n inicial evita colar na última linha)
          sed -i '/^org.gradle.jvmargs/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Renomear APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/street-running-${{ steps.versao.outputs.v }}.apk"
          if [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::warning::APK assinado com chave de DEBUG (instala normalmente, mas não serve para a Play Store)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ====================================================================== iOS
  ios:
    name: iOS (IPA)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      P12_B64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Versão do app
        id: versao
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Gerar projeto nativo (expo prebuild)
        run: |
          # buildNumber = número da execução (cada IPA novo instala por cima do anterior)
          node -e "const j=require('./app.json');j.expo.ios.buildNumber=String(process.env.GITHUB_RUN_NUMBER);require('fs').writeFileSync('app.json',JSON.stringify(j,null,2))"
          npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Instalar Pods
        working-directory: mobile/ios
        run: pod install

      # O expo-modules-jsi declara swift_version 6.0 e Xcodes mais novos tratam um diagnóstico
      # de concorrência dele como ERRO. Em modo Swift 5 é só aviso (o código gerado é o mesmo).
      - name: Compatibilidade com o Xcode
        working-directory: mobile/ios
        run: |
          xcodebuild -version
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("Pods/Pods.xcodeproj")
            p.targets.select { |t| t.name == "ExpoModulesJSI" }.each do |t|
              t.build_configurations.each { |c| c.build_settings["SWIFT_VERSION"] = "5.0" }
              puts "SWIFT_VERSION=5.0 em #{t.name}"
            end
            p.save'

      - name: Localizar workspace e scheme
        id: proj
        working-directory: mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=${WS%.xcworkspace}" >> "$GITHUB_OUTPUT"

      # ---------- IPA ASSINADO (quando os secrets IOS_* existem) ----------
      - name: Instalar certificado e perfil de provisionamento
        if: env.P12_B64 != '' && env.PROFILE_B64 != '' && env.TEAM_ID != ''
        id: assinatura
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "bundle=$(node -p "require('./app.json').expo.ios.bundleIdentifier")" >> "$GITHUB_OUTPUT"

      - name: Compilar IPA assinado
        if: steps.assinatura.outcome == 'success'
        working-directory: mobile/ios
        env:
          UUID: ${{ steps.assinatura.outputs.uuid }}
          IDENTITY: ${{ steps.assinatura.outputs.identity }}
          BUNDLE_ID: ${{ steps.assinatura.outputs.bundle }}
        run: |
          set -o pipefail
          PBX=$(ls -d *.xcodeproj | head -1)/project.pbxproj
          sed -i '' -e '/CODE_SIGN_STYLE = /d' -e '/DEVELOPMENT_TEAM = /d' -e '/PROVISIONING_PROFILE_SPECIFIER = /d' -e '/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = /d' "$PBX"
          sed -i '' -E "s|PRODUCT_BUNDLE_IDENTIFIER = \"?$BUNDLE_ID\"?;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$IDENTITY\";|g" "$PBX"
          xcodebuild -workspace "${{ steps.proj.outputs.workspace }}" -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive | xcbeautify --renderer github-actions
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${UUID}</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/dist/street-running-${{ steps.versao.outputs.v }}.ipa"

      # ---------- IPA SEM ASSINATURA (sem secrets IOS_*) ----------
      - name: Compilar IPA sem assinatura
        if: steps.assinatura.outcome != 'success'
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace "${{ steps.proj.outputs.workspace }}" -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | xcbeautify --renderer github-actions
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/street-running-${{ steps.versao.outputs.v }}-unsigned.ipa" Payload)
          echo "::warning::IPA sem assinatura: instale com Sideloadly/AltStore usando seu Apple ID (ou configure os secrets IOS_*)."

      - name: Limpar keychain
        if: always() && steps.assinatura.outcome == 'success'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  # ================================================================== RELEASE
  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
